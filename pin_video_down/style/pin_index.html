<!DOCTYPE html>
<html>
<head>
    <title>Magic Python App</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <h1>Pinterest Downloader</h1>

    <div id="loading">⚙️ Initializing app, please wait...</div>

    <button onclick="browse()" id="select_folder">Select Folder</button>
    
    <div id="folderDisplay"></div>

    <input id="url" type="text" title="Link" placeholder="https://www.pinterest.com/pin/..." size="70">
    
    <button onclick="download()" id="download">Download!</button>
    <p id="progressText"></p>
        <div id="progressBar">
        <div id="progressFill"></div>
    </div>

    <div id="result"></div>

    <!-- Hidden until Python tells us whether the user is logged in -->
    <div id="loginArea">
        <p id="loginStatus"></p>
        <button onclick="openLogin()" id="loginBtn">Log in (optional)</button>
        <button onclick="logOut()" id="logoutBtn">Log out</button>
    </div>


    <!--JavaScript to handle button clicks and progress updates-->
    <script>
        
        document.getElementById('select_folder').disabled = true;
        document.getElementById('download').disabled = true;
        function backendReady() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('select_folder').disabled = false;
            document.getElementById('download').disabled = false;
            refreshLoginState();
        };

        let selectedFolder = "";

        function browse(){
            window.pywebview.api.select_folder().then(folder => {
                if (folder && folder.length > 0) {
                    selectedFolder = folder[0];
                    document.getElementById('folderDisplay').innerHTML = '<img src="dev-icon-89 (1).svg" alt="Folder Icon" width="20" height="20"> Selected folder: ' + selectedFolder;
                }
            })
        }

        function downloadFinished(message) {
            const result = document.getElementById('result');
            const btn = document.getElementById('download');
            btn.disabled = false;

            // Reset progress
            document.getElementById("progressText").textContent = "";
            document.getElementById("progressFill").style.width = "0%";

            if (message && message.includes("complete")) {
                    result.innerHTML = '✔ Download complete!';
                    result.classList.remove('warning');
                    result.classList.add('success');
                }
            else {
                result.innerHTML = message || '✖ Failed to download. Try again.';
                result.classList.remove('success');
                result.classList.add('warning');
            }
        }

        function download() {
            const url = document.getElementById('url').value;
            const result = document.getElementById('result');

            if (result.classList.contains('warning') || result.classList.contains('success')){
                result.style.transition = "opacity 0.5s ease-out";
                result.style.opacity = 0;
                setTimeout(() => {
                    result.classList.remove('warning', 'success');
                    result.innerHTML = '';
                    result.style.opacity = 1;
                }, 500);
            }

            if(!url || !selectedFolder) {
                result.innerHTML = '✖ Please enter URL and select folder first!';
                result.classList.add('warning');
                return;
            }

            if (!url.startsWith("http")) {
                result.innerHTML = '✖ Please enter a valid URL!';
                result.classList.add('warning');
                return;
            }

            if (url && selectedFolder){ 
                const btn = document.getElementById('download');
                const result = document.getElementById('result');

                btn.disabled = true;

                window.pywebview.api.download(url, selectedFolder).then(response => {

                    result.innerHTML = response;
                    result.classList.remove('warning', 'success');
                    
                }).catch(err => {
                    const result = document.getElementById('result');
                    result.innerHTML = '✖ Failed to download. Try again.';
                    result.classList.remove('success');
                    result.classList.add('warning');
                    btn.disabled = false;
                });
                
            } 
        }

        // ---------- login / logout ----------

        function showMessage(text, type, hideAfterMs) {
            const result = document.getElementById('result');
            result.style.transition = '';
            result.style.opacity = 1;
            result.innerHTML = text;
            result.classList.remove('warning', 'success');
            result.classList.add(type);

            // optional: fade the message away after hideAfterMs milliseconds
            if (hideAfterMs) {
                const shown = result.innerHTML;
                setTimeout(() => {
                    if (result.innerHTML !== shown) return;   // something newer is showing, leave it
                    result.style.transition = 'opacity 0.5s ease-out';
                    result.style.opacity = 0;
                    setTimeout(() => {
                        if (result.innerHTML === shown) {
                            result.classList.remove('warning', 'success');
                            result.innerHTML = '';
                        }
                        result.style.opacity = 1;
                    }, 500);
                }, hideAfterMs);
            }
        }

        // Shows "Log in (optional)" when logged out, "Log out" when logged in
        function setLoginUI(loggedIn) {
            document.getElementById('loginArea').style.display = 'block';
            document.getElementById('loginBtn').style.display = loggedIn ? 'none' : 'inline-block';
            document.getElementById('logoutBtn').style.display = loggedIn ? 'inline-block' : 'none';

            const status = document.getElementById('loginStatus');
            status.classList.toggle('on', loggedIn);
            status.textContent = loggedIn
                ? '✔ Logged in to Pinterest'
                : 'Not logged in. Public pins work without logging in.';
        }

        function refreshLoginState() {
            try {
                window.pywebview.api.get_login_state().then(setLoginUI);
            } catch (e) {
                // api not ready yet - backendReady() runs again a few seconds later
            }
        }

        // Python calls this after the login window saved the cookies
        function loginStateChanged(loggedIn) {
            setLoginUI(loggedIn);
        }

        function openLogin() {
            window.pywebview.api.open_login_window().then(status => {
                if (status === 'already_logged_in') {
                    setLoginUI(true);
                    showMessage("✔ You're already logged in.", 'success', 3000);
                } else if (status === 'already_open') {
                    showMessage('The login window is already open.', 'warning', 3000);
                }
            });
        }

        function logOut() {
            if (!confirm("Log out? This deletes the Pinterest cookies saved by this app. Your browser stays logged in.")) return;
            window.pywebview.api.log_out().then(ok => {
                if (ok) {
                    setLoginUI(false);
                    showMessage('✔ Logged out. Saved cookies were deleted.', 'success', 3000);
                } else {
                    showMessage('✖ Could not log out.', 'warning');
                }
            });
        }
            
        function updateProgress(percent) {
            const p = document.getElementById("progressText");
            const fill = document.getElementById("progressFill");

            // Extract just the number (e.g., "9.5" from "9.5%")
            const match = percent.match(/([\d.]+)%/);
            const value = match ? parseFloat(match[1]) : 0;

            p.textContent = `Downloading... ${value.toFixed(1)}%`;
            fill.style.width = `${value}%`;
        }
    </script>

    
    
</body> 
</html>
